# Pinned dependency versions enforced across the workspace.
# `pnpm check` validates and `pnpm fix` applies these versions.
npm:
  '@angular-devkit/core': '^22.1.0'
  '@angular-devkit/schematics': '^22.1.0'
  '@cpdevtools/git-flow': '^1.3.0'
  '@cpdevtools/git-flow-cli': '^1.3.0'
  '@cpdevtools/ts-dev-utilities': '^1.2.1'
  '@cpdevtools/ts-dev-utilities-cli': '^1.2.1'
  '@eslint/js': '^9.18.0'
  '@types/node': '^24.0.0'
  eslint: '^9.18.0'
  husky: '^9.1.7'
  prettier: '^3.8.1'
  syncpack: '^13.0.0'
  ts-morph: '^28.0.0'
  typescript: '~6.0.2'
  typescript-eslint: '^8.69.0'
  vitest: '^4.0.8'

github-actions:
  actions/checkout: v7
  actions/setup-node: v6
  pnpm/action-setup: v6
